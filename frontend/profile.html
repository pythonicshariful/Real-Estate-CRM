<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - CRM v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="flex h-screen overflow-hidden text-slate-100">

  <!-- Sidebar -->
  <aside class="sidebar glass-dark h-full flex flex-col hidden md:flex border-r border-slate-800 relative z-20">
    <div class="p-6 flex items-center justify-between">
      <div class="font-bold text-xl tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-violet-400">SL CRM</div>
    </div>
    
    <div class="flex-1 overflow-y-auto px-4 py-2 space-y-8 scrollbar-hide">
      
      <!-- CORE -->
      <div>
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Core</div>
        <nav class="space-y-1">
          <a href="/dashboard.html" class="sidebar-item flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-300">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
          </a>
          <a href="/profile.html" class="sidebar-item active flex items-center px-3 py-2 text-sm font-medium rounded-lg text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            My Profile
          </a>
        </nav>
      </div>

      <!-- LEAD ENGINE -->
      <div>
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Lead Engine</div>
        <nav class="space-y-1">
          <a href="/leads.html" class="sidebar-item flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-300">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            Leads
          </a>
          <a href="/pipeline.html" class="sidebar-item flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-300">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            Pipeline
          </a>
        </nav>
      </div>
      
    </div>
    
    <div class="p-4 border-t border-slate-800">
      <div class="flex items-center gap-3 cursor-pointer sidebar-item p-2 rounded-lg" onclick="window.logout()">
        <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" id="sidebar-avatar" class="w-8 h-8 rounded-full">
        <div>
          <div class="text-sm font-medium text-white">Log Out</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    
    <!-- Topbar -->
    <header class="glass-dark border-b border-slate-800 h-16 flex items-center justify-between px-6 z-10 relative">
      <div class="text-lg font-semibold">My Profile</div>
    </header>

    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Profile Info -->
        <div class="glass p-5 rounded-2xl md:col-span-1">
          <div class="flex flex-col items-center">
            <div class="relative group w-32 h-32 mb-4">
              <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" class="w-full h-full rounded-full object-cover border-4 border-slate-700">
              <label class="absolute inset-0 flex items-center justify-center bg-black/50 opacity-0 group-hover:opacity-100 rounded-full cursor-pointer transition-opacity">
                <span class="text-sm">Change</span>
                <input type="file" id="avatar-input" class="hidden" accept="image/*">
              </label>
            </div>
            <h2 id="profile-name" class="text-xl font-bold">Loading...</h2>
            <p id="profile-role" class="text-sm text-slate-400">Loading...</p>
          </div>
          
          <div class="mt-6 space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
              <input type="text" id="input-fullname" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Phone Number</label>
              <input type="text" id="input-phone" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <button id="save-profile-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition-colors">
              Save Changes
            </button>
            <p id="save-msg" class="text-xs text-emerald-400 text-center mt-2 hidden">Profile saved successfully!</p>
          </div>
        </div>
        
        <!-- Stats and Activities -->
        <div class="glass p-5 rounded-2xl md:col-span-2 space-y-6">
          <h3 class="text-lg font-semibold">Performance Overview</h3>
          <div class="grid grid-cols-3 gap-4">
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
              <div class="text-xs text-slate-400">Total Leads</div>
              <div id="stat-total" class="text-2xl font-bold text-white mt-1">-</div>
            </div>
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
              <div class="text-xs text-slate-400">Active Leads</div>
              <div id="stat-active" class="text-2xl font-bold text-indigo-400 mt-1">-</div>
            </div>
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
              <div class="text-xs text-slate-400">Completed Tasks</div>
              <div id="stat-tasks" class="text-2xl font-bold text-emerald-400 mt-1">-</div>
            </div>
          </div>
          
          <h3 class="text-lg font-semibold mt-8 mb-4">Recent Activities</h3>
          <div class="space-y-3" id="activities-list">
            <div class="text-sm text-slate-400">Loading activities...</div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script type="module">
    import { apiFetch } from '/assets/js/app.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetUserId = urlParams.get('user_id');
      const isViewingOther = !!targetUserId;
      
      const profileUrl = isViewingOther ? \`/api/team/lead-owners/\${targetUserId}\` : '/api/auth/me';
      const statsUrl = isViewingOther ? \`/api/team/lead-owners/\${targetUserId}/stats\` : '/api/auth/me/stats';

      if (isViewingOther) {
          // Hide save and avatar upload if viewing someone else
          document.getElementById('save-profile-btn').style.display = 'none';
          document.querySelector('label.absolute.inset-0').style.display = 'none';
          document.getElementById('input-fullname').disabled = true;
          document.getElementById('input-phone').disabled = true;
      }

      // Fetch Profile
      try {
        const user = await apiFetch(profileUrl);
        document.getElementById('profile-name').textContent = user.full_name;
        document.getElementById('profile-role').textContent = user.role;
        document.getElementById('input-fullname').value = user.full_name;
        document.getElementById('input-phone').value = user.phone || '';
        
        if (user.avatar_url) {
            document.getElementById('profile-avatar').src = user.avatar_url;
            if (!isViewingOther) {
                document.getElementById('sidebar-avatar').src = user.avatar_url;
            }
        }
      } catch (err) {
        console.error(err);
      }
      
      // Fetch Stats
      try {
        const stats = await apiFetch(statsUrl);
        document.getElementById('stat-total').textContent = stats.total_leads;
        document.getElementById('stat-active').textContent = stats.active_leads;
        document.getElementById('stat-tasks').textContent = stats.completed_tasks;
        
        const actList = document.getElementById('activities-list');
        actList.innerHTML = '';
        if (stats.recent_activities.length === 0) {
            actList.innerHTML = '<div class="text-sm text-slate-500">No recent activities found.</div>';
        } else {
            stats.recent_activities.forEach(act => {
                const date = new Date(act.created_at).toLocaleString();
                actList.innerHTML += `
                  <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-800 text-sm">
                    <div class="flex justify-between items-center mb-1">
                      <span class="font-medium text-indigo-400">${act.type}</span>
                      <span class="text-xs text-slate-500">${date}</span>
                    </div>
                    <div class="text-slate-300">${act.notes || 'No notes provided.'}</div>
                  </div>
                `;
            });
        }
      } catch (err) {
        console.error(err);
      }
      
      // Save Profile
      document.getElementById('save-profile-btn').addEventListener('click', async () => {
        const full_name = document.getElementById('input-fullname').value;
        const phone = document.getElementById('input-phone').value;
        try {
          await apiFetch('/api/auth/me', {
            method: 'PUT',
            body: JSON.stringify({ full_name, phone })
          });
          document.getElementById('save-msg').classList.remove('hidden');
          setTimeout(() => document.getElementById('save-msg').classList.add('hidden'), 3000);
          document.getElementById('profile-name').textContent = full_name;
        } catch(err) {
          alert('Failed to save profile');
        }
      });
      
      // Avatar Upload
      document.getElementById('avatar-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const formData = new FormData();
        formData.append('avatar', file);
        
        try {
            const token = localStorage.getItem('crm_access_token');
            const res = await fetch('/api/auth/me/avatar', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                body: formData
            });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('profile-avatar').src = data.avatar_url;
                document.getElementById('sidebar-avatar').src = data.avatar_url;
            } else {
                alert('Avatar upload failed');
            }
        } catch (err) {
            console.error(err);
        }
      });
    });
  </script>
</body>
</html>
