<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Details - CRM v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100">

  <!-- Sidebar -->
  <aside class="sidebar glass-dark h-full flex flex-col hidden md:flex border-r border-slate-800 relative z-20">
    <div class="p-6 flex items-center justify-between">
      <div class="font-bold text-xl tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-violet-400">SL CRM</div>
    </div>
    
    <div class="flex-1 overflow-y-auto px-4 py-2 space-y-8 scrollbar-hide">
      
      <!-- CORE -->
      <div>
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Core</div>
        <nav class="space-y-1">
          <a href="/dashboard.html" class="sidebar-item flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-300">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
          </a>
          <a href="/profile.html" class="sidebar-item flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-300">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            My Profile
          </a>
        </nav>
      </div>

      <!-- LEAD ENGINE -->
      <div>
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Lead Engine</div>
        <nav class="space-y-1">
          <a href="/leads.html" class="sidebar-item active flex items-center px-3 py-2 text-sm font-medium rounded-lg text-white">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            Leads
          </a>
          <a href="/pipeline.html" class="sidebar-item flex items-center px-3 py-2 text-sm font-medium rounded-lg text-slate-300">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            Pipeline
          </a>
        </nav>
      </div>
      
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <!-- Topbar -->
    <header class="glass-dark border-b border-slate-800 h-16 flex items-center px-6 z-10 relative">
      <a href="/leads.html" class="text-indigo-400 hover:text-indigo-300 mr-4 flex items-center text-sm">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Back to Leads
      </a>
      <div class="text-lg font-semibold" id="lead-name-header">Lead Details</div>
    </header>

    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Lead Info Card -->
        <div class="glass p-5 rounded-2xl md:col-span-1 space-y-6">
          <div>
            <h2 id="lead-name" class="text-xl font-bold text-white mb-1">Loading...</h2>
            <div class="flex items-center gap-2 mb-4">
              <span id="lead-stage" class="badge badge-assigned text-xs px-2 py-1 rounded-md">-</span>
              <span id="lead-temp" class="text-xs px-2 py-1 rounded-md bg-slate-800 border border-slate-700">-</span>
            </div>
          </div>
          
          <div class="space-y-4">
            <div>
              <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Contact Info</div>
              <div class="flex items-center gap-2 text-sm text-slate-300">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                <span id="lead-phone">-</span>
              </div>
              <div class="flex items-center gap-2 text-sm text-slate-300 mt-2">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <span id="lead-email">-</span>
              </div>
            </div>
            
            <div>
              <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Source & Project</div>
              <div class="text-sm text-slate-300"><span class="text-slate-500">Source:</span> <span id="lead-source">-</span></div>
              <div class="text-sm text-slate-300"><span class="text-slate-500">Project:</span> <span id="lead-project">-</span></div>
            </div>
            
            <div class="pt-4 border-t border-slate-800">
              <button onclick="document.getElementById('note-modal').classList.remove('hidden')" class="w-full bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm transition-colors border border-slate-700 mb-2">
                Add Note
              </button>
            </div>
          </div>
        </div>
        
        <!-- Activity Timeline -->
        <div class="glass p-5 rounded-2xl md:col-span-2">
          <h3 class="text-lg font-semibold mb-6 border-b border-slate-800 pb-2">Activity Timeline</h3>
          
          <div id="timeline" class="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-700 before:to-transparent">
            <div class="text-center text-sm text-slate-500 py-4">Loading timeline...</div>
          </div>
        </div>

      </div>

    </div>
  </main>
  
  <!-- Add Note Modal -->
  <div id="note-modal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-4">
    <div class="glass-dark border border-slate-700 rounded-2xl w-full max-w-md p-6">
      <h3 class="text-lg font-semibold text-white mb-4">Add Note</h3>
      <textarea id="note-text" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 text-white" placeholder="Write your note here..."></textarea>
      <div class="flex justify-end gap-3 mt-4">
        <button onclick="document.getElementById('note-modal').classList.add('hidden')" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white transition-colors">Cancel</button>
        <button id="save-note-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Save Note</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { apiFetch } from '/assets/js/app.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const leadId = urlParams.get('id');
      
      if (!leadId) {
          alert('No lead ID specified');
          window.location.href = '/leads.html';
          return;
      }
      
      let leadData = null;
      
      async function loadLead() {
          try {
              leadData = await apiFetch(`/api/leads/${leadId}/profile`);
              
              // Populate Header/Sidebar Info
              document.getElementById('lead-name-header').textContent = leadData.contact?.full_name || 'Unknown Lead';
              document.getElementById('lead-name').textContent = leadData.contact?.full_name || 'Unknown Lead';
              
              document.getElementById('lead-stage').textContent = leadData.pipeline_stage;
              document.getElementById('lead-temp').textContent = leadData.lead_temperature || 'COLD';
              
              document.getElementById('lead-phone').textContent = leadData.contact?.phone || '-';
              document.getElementById('lead-email').textContent = leadData.contact?.email || '-';
              document.getElementById('lead-source').textContent = leadData.contact?.source || '-';
              document.getElementById('lead-project').textContent = leadData.project_name || '-';
              
              // Build Timeline
              buildTimeline();
          } catch (err) {
              console.error(err);
              alert('Failed to load lead details');
          }
      }
      
      function buildTimeline() {
          const tl = document.getElementById('timeline');
          tl.innerHTML = '';
          
          // Collect and sort all activities
          let activities = [];
          
          if (leadData.call_logs) {
              leadData.call_logs.forEach(c => {
                  activities.push({
                      type: 'Log',
                      date: new Date(c.created_at),
                      content: c.notes,
                      detail: `Outcome: ${c.outcome || 'N/A'}`
                  });
              });
          }
          
          if (leadData.appointments) {
              leadData.appointments.forEach(a => {
                  activities.push({
                      type: 'Appointment',
                      date: new Date(a.appointment_datetime),
                      content: `Scheduled at ${a.location || 'N/A'}`,
                      detail: `Status: ${a.status}`
                  });
              });
          }
          
          // Sort descending
          activities.sort((a, b) => b.date - a.date);
          
          if (activities.length === 0) {
              tl.innerHTML = '<div class="text-center text-sm text-slate-500 py-4">No activities yet.</div>';
              return;
          }
          
          activities.forEach(act => {
              const dateStr = act.date.toLocaleString();
              let icon = '<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
              if (act.type === 'Appointment') {
                  icon = '<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>';
              }
              
              tl.innerHTML += `
                <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                  <div class="flex items-center justify-center w-10 h-10 rounded-full border border-slate-700 bg-slate-900 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                    ${icon}
                  </div>
                  <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] glass p-4 rounded-xl shadow">
                    <div class="flex items-center justify-between mb-1">
                      <div class="font-bold text-white">${act.type}</div>
                      <div class="text-xs text-slate-400">${dateStr}</div>
                    </div>
                    <div class="text-sm text-slate-300 mt-2">${act.content || ''}</div>
                    <div class="text-xs text-slate-500 mt-2">${act.detail || ''}</div>
                  </div>
                </div>
              `;
          });
      }
      
      document.getElementById('save-note-btn').addEventListener('click', async () => {
          const text = document.getElementById('note-text').value;
          if (!text.trim()) return;
          try {
              await apiFetch(`/api/leads/${leadId}/notes`, {
                  method: 'POST',
                  body: JSON.stringify({ text })
              });
              document.getElementById('note-text').value = '';
              document.getElementById('note-modal').classList.add('hidden');
              loadLead();
          } catch(err) {
              alert('Failed to add note');
          }
      });
      
      loadLead();
    });
  </script>
</body>
</html>
