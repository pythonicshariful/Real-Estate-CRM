<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads - CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0f0f1a]">
  
  <!-- Sidebar omitted for brevity, same as dashboard -->
  
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <header class="glass-dark border-b border-slate-800 h-16 flex items-center justify-between px-6">
      <div class="text-lg font-semibold">Leads Workspace</div>
      <button class="btn-gradient px-4 py-2 rounded-lg text-sm font-medium">+ New Lead</button>
    </header>

    <div class="glass bg-red-500/20 text-red-200 p-2 text-center text-sm font-medium border-b border-red-500/30 overdue-pulse">
      3 leads are overdue - Immediate action required
    </div>

    <div class="p-4 border-b border-slate-800 flex gap-4 overflow-x-auto">
      <select class="input-glass px-3 py-1.5 rounded text-sm">
        <option>All Stages</option>
      </select>
      <select class="input-glass px-3 py-1.5 rounded text-sm">
        <option>All Temperatures</option>
      </select>
      <input type="text" placeholder="Search..." class="input-glass px-3 py-1.5 rounded text-sm flex-1 max-w-xs">
    </div>

    <div class="flex-1 overflow-y-auto p-4" id="leads-container">
      <!-- Cards -->
      <div class="glass p-4 rounded-xl flex items-center justify-between mb-3 hover:bg-white/5 transition cursor-pointer">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-300 font-bold">JD</div>
          <div>
            <div class="font-medium text-white flex items-center gap-2">John Doe <span class="badge badge-new">New</span></div>
            <div class="text-xs text-slate-400 mt-1">01711223344 • 2 days ago</div>
          </div>
        </div>
        <div class="flex gap-2">
          <button class="btn-ghost p-2 rounded-lg text-indigo-300 hover:text-white" onclick="openCallModal()"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg></button>
        </div>
      </div>
    </div>
  </main>

  <!-- Call Modal -->
  <div id="call-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="glass-dark p-6 rounded-2xl w-full max-w-lg border border-slate-700">
      <h2 class="text-xl font-semibold mb-4">Log Call</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Connected?</label>
          <div class="flex gap-2">
            <button class="flex-1 py-2 rounded glass border-indigo-500 text-indigo-300">Yes</button>
            <button class="flex-1 py-2 rounded glass border-slate-700">No</button>
          </div>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Notes</label>
          <textarea class="input-glass w-full rounded p-2 h-24" placeholder="Call summary..."></textarea>
        </div>
        <div class="flex gap-3 mt-6">
          <button class="flex-1 btn-ghost py-2 rounded" onclick="closeCallModal()">Cancel</button>
          <button class="flex-1 btn-gradient py-2 rounded text-white font-medium">Save Log</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openCallModal() { document.getElementById('call-modal').classList.remove('hidden'); }
    function closeCallModal() { document.getElementById('call-modal').classList.add('hidden'); }
  </script>
</body>
</html>
