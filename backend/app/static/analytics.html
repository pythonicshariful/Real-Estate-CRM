<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0f0f1a]">
  
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="glass-dark border-b border-slate-800 min-h-16 py-2 md:py-0 flex items-center justify-between px-4 md:px-6 flex-wrap gap-2">
      <div class="text-lg font-semibold">KPI Analytics</div>
      <div class="flex gap-2">
        <select class="input-glass px-3 py-1.5 rounded text-sm">
          <option>This Month</option>
        </select>
        <button class="btn-ghost px-3 py-1.5 rounded text-sm font-medium">Export CSV</button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      <!-- 20 KPI Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- Replicating some for layout -->
        <div class="glass p-4 rounded-xl text-center">
          <div class="text-xs text-slate-400 font-medium">New Leads</div>
          <div class="mt-1 text-2xl font-bold text-white">450</div>
          <div class="text-xs text-emerald-400 mt-1">↑ 5% vs last month</div>
        </div>
        <div class="glass p-4 rounded-xl text-center">
          <div class="text-xs text-slate-400 font-medium">Contact Rate</div>
          <div class="mt-1 text-2xl font-bold text-white">82%</div>
          <div class="text-xs text-emerald-400 mt-1">Target: 80%</div>
        </div>
        <div class="glass p-4 rounded-xl text-center">
          <div class="text-xs text-slate-400 font-medium">Appointments</div>
          <div class="mt-1 text-2xl font-bold text-white">120</div>
          <div class="text-xs text-red-400 mt-1">↓ 2% vs last month</div>
        </div>
        <div class="glass p-4 rounded-xl text-center">
          <div class="text-xs text-slate-400 font-medium">Site Visits</div>
          <div class="mt-1 text-2xl font-bold text-white">85</div>
          <div class="text-xs text-emerald-400 mt-1">Target: 80</div>
        </div>
        <div class="glass p-4 rounded-xl text-center">
          <div class="text-xs text-slate-400 font-medium">Sales Closed</div>
          <div class="mt-1 text-2xl font-bold text-white">12</div>
          <div class="text-xs text-emerald-400 mt-1">Target: 10</div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass p-5 rounded-2xl">
          <div class="font-semibold mb-4">Lead Source Distribution</div>
          <canvas id="source-chart" height="200"></canvas>
        </div>
        <div class="glass p-5 rounded-2xl">
          <div class="font-semibold mb-4">Revenue by Project</div>
          <canvas id="revenue-chart" height="200"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script>
    const sourceCtx = document.getElementById('source-chart').getContext('2d');
    new Chart(sourceCtx, {
      type: 'doughnut',
      data: {
        labels: ['Facebook', 'Google', 'Direct', 'Referral'],
        datasets: [{
          data: [45, 25, 20, 10],
          backgroundColor: ['#6366f1', '#06b6d4', '#10b981', '#f59e0b'],
          borderWidth: 0
        }]
      },
      options: { plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
    });

    const revCtx = document.getElementById('revenue-chart').getContext('2d');
    new Chart(revCtx, {
      type: 'bar',
      data: {
        labels: ['Project A', 'Project B', 'Project C'],
        datasets: [{
          label: 'Revenue',
          data: [15000000, 12000000, 8000000],
          backgroundColor: '#8b5cf6',
          borderRadius: 4
        }]
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.1)' } }, x: { grid: { display: false } } } }
    });
  </script>
</body>
</html>
