<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team & User Management - CRM v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0f0f1a]">

  <!-- Sidebar injected here -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="glass-dark border-b border-slate-800 h-16 flex items-center justify-between px-6 z-10">
      <div>
        <h1 class="text-xl font-bold text-white">Team & User Management</h1>
        <p class="text-xs text-slate-400">Manage admin, manager, executive, and owner accounts</p>
      </div>
      <button id="open-create-user-modal" class="btn-gradient px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-500/25 flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Create New Account
      </button>
    </header>

    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      <!-- User Accounts List Grid -->
      <div>
        <h2 class="text-base font-semibold text-slate-200 mb-4 flex items-center gap-2">
          <span>All Accounts</span>
          <span id="user-count-badge" class="px-2 py-0.5 rounded-full text-xs bg-indigo-500/20 text-indigo-300 font-normal">Active System Users</span>
        </h2>
        <div id="team-users-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <div class="col-span-full text-center py-12 text-slate-400">Loading user accounts...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Create User Modal -->
  <div id="create-user-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 hidden p-4">
    <div class="glass-dark border border-white/15 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
      <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10">
        <div>
          <h3 class="text-lg font-bold text-white">Create Account</h3>
          <p class="text-xs text-slate-400">Add an Admin, Owner, Manager, or Executive account</p>
        </div>
        <button id="close-create-user-modal" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-white/10">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form id="create-user-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Full Name</label>
          <input type="text" id="user-name" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm" placeholder="e.g. Md. Tanvir Ahmed" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Email Address</label>
          <input type="email" id="user-email" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm" placeholder="user@southeast.com" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
          <input type="password" id="user-password" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm" placeholder="••••••••••••" required minlength="6">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Account Role</label>
            <select id="user-role" class="w-full input-glass px-3 py-2.5 rounded-xl text-sm text-white bg-slate-900 focus:bg-slate-900">
              <option value="ADMIN">ADMIN (System Admin)</option>
              <option value="CEO">CEO (Owner / Executive)</option>
              <option value="GM">GM (General Manager)</option>
              <option value="MANAGER">MANAGER (Team Manager)</option>
              <option value="EXECUTIVE" selected>EXECUTIVE (Sales Exec)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Phone</label>
            <input type="text" id="user-phone" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm" placeholder="+8801700000000">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Max Lead Capacity</label>
          <input type="number" id="user-capacity" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm" value="30" min="1" max="500">
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/10">
          <button type="button" onclick="document.getElementById('create-user-modal').classList.add('hidden')" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" id="create-user-submit-btn" class="btn-gradient px-6 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-500/25">Create Account</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/assets/js/sidebar.js"></script>
  <script type="module" src="/assets/js/api.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
  <script type="module" src="/assets/js/auth.js"></script>
  <script type="module" src="/assets/js/team.js"></script>
</body>
</html>
