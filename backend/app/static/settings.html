<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Southeast CRM v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0a0a14]">
  <div id="sidebar-container"></div>
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="glass-dark border-b border-slate-800/60 min-h-14 py-2 md:py-0 flex items-center justify-between px-4 md:px-6 flex-shrink-0 flex-wrap gap-2">
      <div><div class="text-sm font-bold text-white">System Settings</div><div class="text-xs text-slate-500">Global configurations, webhooks, and SLAs</div></div>
    </header>
    <div class="flex flex-1 overflow-hidden">
      <!-- Settings Sidebar -->
      <div class="w-64 border-r border-slate-800/60 p-4 space-y-2 glass-dark">
        <button class="w-full text-left px-4 py-2 rounded-lg bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Meta Webhook</button>
        <button class="w-full text-left px-4 py-2 rounded-lg text-slate-400 hover:bg-white/5 font-medium transition-colors">General</button>
        <button class="w-full text-left px-4 py-2 rounded-lg text-slate-400 hover:bg-white/5 font-medium transition-colors">SLA Config</button>
        <button class="w-full text-left px-4 py-2 rounded-lg text-slate-400 hover:bg-white/5 font-medium transition-colors">Users & Roles</button>
        <button class="w-full text-left px-4 py-2 rounded-lg text-slate-400 hover:bg-white/5 font-medium transition-colors">Email Templates</button>
      </div>

      <!-- Settings Content -->
      <div class="flex-1 overflow-y-auto p-6">
        <div class="max-w-2xl space-y-6">
          <div class="chart-title">Meta Webhook Configuration</div>
          
          <div class="glass border-l-4 border-emerald-500 p-4 rounded-xl flex items-center justify-between">
            <div>
              <div class="text-sm font-bold text-white">Webhook Status: Active</div>
              <div class="text-xs text-slate-400 mt-0.5">Last payload received 4 mins ago</div>
            </div>
            <button class="btn-ghost px-3 py-1.5 rounded-lg text-xs font-semibold">Test Connection</button>
          </div>

          <div class="chart-card space-y-5">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Webhook URL</label>
              <input type="text" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm font-mono text-indigo-300" value="https://crm.southeast.com/api/webhooks/meta" readonly>
              <p class="text-[10px] text-slate-500 mt-1">Provide this URL in the Meta Developer Portal.</p>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Verify Token</label>
              <input type="text" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm font-mono" value="sl_crm_secure_webhook_token_2025">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">App Secret</label>
              <input type="password" class="w-full input-glass px-4 py-2.5 rounded-xl text-sm font-mono" value="••••••••••••••••">
            </div>
            <div class="pt-2 border-t border-slate-700/50 flex justify-end">
              <button class="btn-gradient px-6 py-2.5 rounded-xl text-sm font-semibold">Save Configuration</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="toast-container"></div>
  <script src="/assets/js/sidebar.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
