<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Log — Southeast CRM v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0a0a14]">
  <div id="sidebar-container"></div>
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="glass-dark border-b border-slate-800/60 min-h-14 py-2 md:py-0 flex items-center justify-between px-4 md:px-6 flex-shrink-0 flex-wrap gap-2">
      <div>
        <div class="text-sm font-bold text-white" id="page-title">Activity Log</div>
        <div class="text-xs text-slate-500">View team and individual activities inside the system</div>
      </div>
    </header>
    
    <div class="flex-1 overflow-y-auto p-5 space-y-5">
      <!-- Filter Card -->
      <div class="chart-card">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div class="chart-title">Filters</div>
          <button id="clear-filters-btn" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700/50">Clear Filters</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
          <div id="filter-user-container" class="hidden">
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Lead Owner</label>
            <select id="filter-user-select" class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="">All Owners</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Start Date</label>
            <input type="date" id="filter-start-date" class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">End Date</label>
            <input type="date" id="filter-end-date" class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <button id="apply-filters-btn" class="w-full btn-gradient px-6 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
              Apply Filters
            </button>
          </div>
        </div>
      </div>

      <!-- Activity Timeline Card -->
      <div class="chart-card">
        <div class="chart-title mb-4">Activities</div>
        <div id="activities-timeline" class="space-y-6 relative before:absolute before:inset-0 before:left-[19px] before:w-[2px] before:bg-slate-800/80 before:h-full pb-8">
          <div class="text-center text-slate-500 py-10">Loading activities...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/sidebar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('crm_token');
      const role = localStorage.getItem('crm_role');
      const isAdmin = role === 'ADMIN';

      if (!isAdmin) {
        document.getElementById('page-title').textContent = 'My Activity Log';
      }

      // Populate user dropdown for admin
      if (isAdmin) {
        const userContainer = document.getElementById('filter-user-container');
        userContainer.classList.remove('hidden');

        const select = document.getElementById('filter-user-select');
        try {
          const res = await fetch('/api/team/members', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const members = await res.json();
            members.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m.id;
              opt.textContent = m.full_name;
              select.appendChild(opt);
            });
          }
        } catch (err) {
          console.error("Failed to load members for filter", err);
        }
      }

      const getActionStyles = (action) => {
        switch (action) {
          case 'LOGIN':
            return {
              color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
              icon: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>'
            };
          case 'LOGOUT':
            return {
              color: 'bg-amber-500/20 text-amber-400 border-amber-500/30',
              icon: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>'
            };
          case 'INSERT':
            return {
              color: 'bg-blue-500/20 text-blue-400 border-blue-500/30',
              icon: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>'
            };
          case 'UPDATE':
            return {
              color: 'bg-purple-500/20 text-purple-400 border-purple-500/30',
              icon: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>'
            };
          case 'DELETE':
            return {
              color: 'bg-rose-500/20 text-rose-400 border-rose-500/30',
              icon: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>'
            };
          default:
            return {
              color: 'bg-slate-500/20 text-slate-400 border-slate-500/30',
              icon: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
            };
        }
      };

      const fetchActivities = async () => {
        const timeline = document.getElementById('activities-timeline');
        timeline.innerHTML = '<div class="text-center text-slate-500 py-10">Loading activities...</div>';

        const userSelect = document.getElementById('filter-user-select');
        const startDate = document.getElementById('filter-start-date').value;
        const endDate = document.getElementById('filter-end-date').value;

        let url = '/api/security/audit-log?';
        if (isAdmin && userSelect && userSelect.value) url += `user_id=${userSelect.value}&`;
        if (startDate) url += `start_date=${startDate}&`;
        if (endDate) url += `end_date=${endDate}&`;

        try {
          const res = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error("Failed to load audit logs");
          const logs = await res.json();

          if (logs.length === 0) {
            timeline.innerHTML = '<div class="text-center text-slate-500 py-10">No activities found matching filters.</div>';
            return;
          }

          timeline.innerHTML = '';
          logs.forEach(log => {
            const styles = getActionStyles(log.action);
            const date = new Date(log.created_at);
            const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });

            const item = document.createElement('div');
            item.className = 'relative pl-12 flex items-start gap-4';
            item.innerHTML = `
              <div class="absolute left-2.5 top-0.5 w-[20px] h-[20px] rounded-full border border-slate-900 ${styles.color} flex items-center justify-center z-10 shadow-[0_0_8px_rgba(0,0,0,0.5)]">
                ${styles.icon}
              </div>
              <div class="flex-1 bg-white/5 border border-white/5 rounded-xl p-4 hover:border-slate-800/80 hover:bg-white/[0.07] transition-all">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-white">${log.user_name}</span>
                    <span class="px-2 py-0.5 text-[9px] font-extrabold tracking-wide uppercase rounded-full bg-slate-800 text-slate-400 border border-slate-700/50">${log.action}</span>
                  </div>
                  <div class="text-[10px] text-slate-500 font-mono">${dateStr} at ${timeStr}</div>
                </div>
                <div class="text-xs text-slate-300 leading-relaxed font-semibold">${log.new_value || log.field_name || 'No details'}</div>
                ${log.old_value ? `<div class="text-[10px] text-slate-500 font-mono mt-1 bg-slate-950/40 px-2 py-1 rounded border border-white/5">Previous value: ${log.old_value}</div>` : ''}
              </div>
            `;
            timeline.appendChild(item);
          });
        } catch (err) {
          console.error(err);
          timeline.innerHTML = '<div class="text-center text-rose-500 py-10 font-medium">Error loading activities. Please try again later.</div>';
        }
      };

      document.getElementById('apply-filters-btn').addEventListener('click', fetchActivities);

      document.getElementById('clear-filters-btn').addEventListener('click', () => {
        const userSelect = document.getElementById('filter-user-select');
        if (userSelect) userSelect.value = '';
        document.getElementById('filter-start-date').value = '';
        document.getElementById('filter-end-date').value = '';
        fetchActivities();
      });

      // Initial load
      fetchActivities();
    });
  </script>
</body>
</html>
