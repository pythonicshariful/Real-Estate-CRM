<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Owners — Southeast CRM</title>
  <meta name="description" content="Manage Lead Owner accounts — create, edit, assign colors, activate or deactivate.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0a0a14]">
  <div id="sidebar-container"></div>
  
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="glass-dark border-b border-slate-800/60 h-14 flex items-center justify-between px-6 flex-shrink-0">
      <div>
        <div class="text-sm font-bold text-white">Lead Owner Management</div>
        <div class="text-xs text-slate-500">Create and manage your sales team</div>
      </div>
      <button id="create-owner-btn" class="btn-gradient px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add Lead Owner
      </button>
    </header>

    <div class="flex-1 overflow-y-auto p-5">
      <div id="owners-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <!-- Dynamically populated -->
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <!-- Create / Edit Modal -->
  <div id="owner-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="bg-[#0f1019] border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200" id="owner-modal-content">
      <div class="border-b border-slate-800 p-5 flex justify-between items-center bg-slate-900/50">
        <h3 class="font-bold text-white text-lg" id="modal-title">Add Lead Owner</h3>
        <button id="close-owner-modal" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="owner-form" class="p-6 space-y-4">
        <input type="hidden" id="edit-owner-id">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Full Name *</label>
          <input type="text" id="owner-name" required class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="e.g. John Rahman">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Email *</label>
          <input type="email" id="owner-email" required class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="john@southeast.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Phone</label>
          <input type="text" id="owner-phone" class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="+880-17xx-xxxxxx">
        </div>
        <div id="password-section">
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Password *</label>
          <input type="password" id="owner-password" class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Min. 6 characters">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Assigned Color</label>
          <div class="flex items-center gap-3">
            <input type="color" id="owner-color" value="#6366f1" class="w-12 h-10 rounded-lg border border-slate-700 bg-slate-900 cursor-pointer p-1">
            <div class="flex-1 grid grid-cols-6 gap-2">
              ${['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#ec4899','#14b8a6','#f97316','#84cc16','#e11d48','#0ea5e9'].map(c => 
                `<button type="button" onclick="document.getElementById('owner-color').value='${c}'" class="w-8 h-8 rounded-full border-2 border-transparent hover:border-white/50 transition-all" style="background:${c}" title="${c}"></button>`
              ).join('')}
            </div>
          </div>
          <div class="mt-2 flex items-center gap-2">
            <div id="color-preview" class="w-full h-1.5 rounded-full" style="background:#6366f1"></div>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Max Lead Capacity</label>
          <input type="number" id="owner-capacity" value="50" min="1" max="500" class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="pt-4 flex justify-end gap-3 border-t border-slate-800">
          <button type="button" id="cancel-owner-modal" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-400 hover:bg-slate-800 transition-colors">Cancel</button>
          <button type="submit" id="save-owner-btn" class="btn-gradient px-6 py-2.5 rounded-xl text-sm font-bold">Create Owner</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div id="reset-pwd-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-[#0f1019] border border-slate-800 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
      <div class="border-b border-slate-800 p-5 flex justify-between items-center">
        <h3 class="font-bold text-white">Reset Password</h3>
        <button id="close-reset-modal" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <form id="reset-pwd-form" class="p-5 space-y-4">
        <input type="hidden" id="reset-owner-id">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">New Password</label>
          <input type="password" id="new-password" required minlength="6" class="w-full bg-[#161825] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="cancel-reset" class="px-4 py-2 rounded-xl text-sm text-slate-400 hover:bg-slate-800">Cancel</button>
          <button type="submit" class="btn-gradient px-5 py-2 rounded-xl text-sm font-bold">Reset Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/sidebar.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
  <script>
    const token = () => localStorage.getItem('crm_token');
    const headers = () => ({ 'Authorization': `Bearer ${token()}`, 'Content-Type': 'application/json' });

    const fetchAPI = async (url, opts = {}) => {
      const res = await fetch(url, { headers: headers(), ...opts });
      if (res.status === 401) { window.location.href = '/index.html'; return null; }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.message || 'API Error');
      return data;
    };

    let owners = [];

    async function loadOwners() {
      try {
        owners = await fetchAPI('/api/team/lead-owners');
        if (!owners) return;
        renderOwners(owners);
      } catch(e) {
        if (window.showToast) window.showToast(e.message, 'error');
      }
    }

    function renderOwners(list) {
      const grid = document.getElementById('owners-grid');
      if (!list.length) {
        grid.innerHTML = `
          <div class="col-span-3 text-center py-20 text-slate-500">
            <svg class="w-12 h-12 mx-auto mb-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <p class="text-sm">No Lead Owners yet.</p>
            <p class="text-xs text-slate-600 mt-1">Click "Add Lead Owner" to create your first one.</p>
          </div>`;
        return;
      }
      grid.innerHTML = list.map(owner => {
        const initials = owner.full_name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const color = owner.calendar_color || '#6366f1';
        const isActive = owner.is_active;
        return `
          <div class="glass-dark border rounded-2xl p-5 flex flex-col gap-4 hover:border-opacity-80 transition-all" style="border-color: ${color}40">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-base flex-shrink-0" style="background: linear-gradient(135deg, ${color}, ${color}99)">
                ${initials}
              </div>
              <div class="flex-1 min-w-0">
                <div class="font-bold text-white text-sm truncate">${owner.full_name}</div>
                <div class="text-xs text-slate-400 truncate">${owner.email || 'N/A'}</div>
              </div>
              <div class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background: ${isActive ? '#22c55e' : '#ef4444'}" title="${isActive ? 'Active' : 'Inactive'}"></div>
            </div>

            <!-- Color Badge -->
            <div class="flex items-center gap-2 px-3 py-2 rounded-lg" style="background: ${color}15; border: 1px solid ${color}30">
              <div class="w-4 h-4 rounded-full" style="background: ${color}"></div>
              <span class="text-xs font-mono" style="color: ${color}">${color}</span>
              <span class="text-xs text-slate-500 ml-auto">Assigned Color</span>
            </div>

            <!-- Actions -->
            <div class="flex gap-2 flex-wrap">
              <button onclick="openEditModal(${owner.id})" class="flex-1 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition-colors">Edit</button>
              <button onclick="openResetPwd(${owner.id})" class="flex-1 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition-colors">Reset Pwd</button>
              <button onclick="toggleStatus(${owner.id}, ${isActive})" class="flex-1 px-3 py-2 rounded-lg ${isActive ? 'bg-rose-500/20 hover:bg-rose-500/30 text-rose-400' : 'bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400'} text-xs font-medium transition-colors">
                ${isActive ? 'Deactivate' : 'Activate'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- Modal helpers ---
    function openModal() {
      const modal = document.getElementById('owner-modal');
      const content = document.getElementById('owner-modal-content');
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
    }
    function closeModal() {
      const modal = document.getElementById('owner-modal');
      const content = document.getElementById('owner-modal-content');
      modal.classList.add('opacity-0'); content.classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    function openEditModal(ownerId) {
      const owner = owners.find(o => o.id === ownerId);
      if (!owner) return;
      document.getElementById('edit-owner-id').value = ownerId;
      document.getElementById('owner-name').value = owner.full_name;
      document.getElementById('owner-email').value = owner.email;
      document.getElementById('owner-phone').value = owner.phone || '';
      document.getElementById('owner-color').value = owner.calendar_color || '#6366f1';
      document.getElementById('owner-capacity').value = owner.max_lead_capacity || 50;
      document.getElementById('password-section').classList.add('hidden');
      document.getElementById('modal-title').textContent = 'Edit Lead Owner';
      document.getElementById('save-owner-btn').textContent = 'Save Changes';
      openModal();
    }

    function openResetPwd(ownerId) {
      document.getElementById('reset-owner-id').value = ownerId;
      document.getElementById('new-password').value = '';
      document.getElementById('reset-pwd-modal').classList.remove('hidden');
    }

    async function toggleStatus(ownerId, isCurrentlyActive) {
      try {
        await fetchAPI(`/api/team/lead-owners/${ownerId}/toggle-status`, { method: 'POST' });
        if (window.showToast) window.showToast(isCurrentlyActive ? 'Lead Owner deactivated' : 'Lead Owner activated', isCurrentlyActive ? 'warning' : 'success');
        loadOwners();
      } catch(e) {
        if (window.showToast) window.showToast(e.message, 'error');
      }
    }

    // Color picker preview
    document.addEventListener('DOMContentLoaded', () => {
      const colorInput = document.getElementById('owner-color');
      const colorPreview = document.getElementById('color-preview');
      colorInput.addEventListener('input', () => { colorPreview.style.background = colorInput.value; });

      // Create button
      document.getElementById('create-owner-btn').addEventListener('click', () => {
        document.getElementById('owner-form').reset();
        document.getElementById('edit-owner-id').value = '';
        document.getElementById('password-section').classList.remove('hidden');
        document.getElementById('modal-title').textContent = 'Add Lead Owner';
        document.getElementById('save-owner-btn').textContent = 'Create Owner';
        openModal();
      });

      document.getElementById('close-owner-modal').addEventListener('click', closeModal);
      document.getElementById('cancel-owner-modal').addEventListener('click', closeModal);
      document.getElementById('owner-modal').addEventListener('click', (e) => { if (e.target === document.getElementById('owner-modal')) closeModal(); });

      // Form submit
      document.getElementById('owner-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const editId = document.getElementById('edit-owner-id').value;
        const payload = {
          full_name: document.getElementById('owner-name').value,
          email: document.getElementById('owner-email').value,
          phone: document.getElementById('owner-phone').value,
          color: document.getElementById('owner-color').value,
          max_lead_capacity: parseInt(document.getElementById('owner-capacity').value),
        };
        if (!editId) {
          payload.password = document.getElementById('owner-password').value;
        }

        try {
          if (editId) {
            await fetchAPI(`/api/team/lead-owners/${editId}`, { method: 'PUT', body: JSON.stringify(payload) });
            if (window.showToast) window.showToast('Lead Owner updated!', 'success');
          } else {
            await fetchAPI('/api/team/lead-owners', { method: 'POST', body: JSON.stringify(payload) });
            if (window.showToast) window.showToast('Lead Owner created!', 'success');
          }
          closeModal();
          loadOwners();
        } catch(e) {
          if (window.showToast) window.showToast(e.message, 'error');
        }
      });

      // Reset password
      document.getElementById('close-reset-modal').addEventListener('click', () => document.getElementById('reset-pwd-modal').classList.add('hidden'));
      document.getElementById('cancel-reset').addEventListener('click', () => document.getElementById('reset-pwd-modal').classList.add('hidden'));
      document.getElementById('reset-pwd-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const ownerId = document.getElementById('reset-owner-id').value;
        const newPwd = document.getElementById('new-password').value;
        try {
          await fetchAPI(`/api/team/lead-owners/${ownerId}/reset-password`, { method: 'POST', body: JSON.stringify({ new_password: newPwd }) });
          if (window.showToast) window.showToast('Password reset successfully!', 'success');
          document.getElementById('reset-pwd-modal').classList.add('hidden');
        } catch(e) {
          if (window.showToast) window.showToast(e.message, 'error');
        }
      });
    });

    loadOwners();
  </script>
</body>
</html>
