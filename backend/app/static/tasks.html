<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — Southeast CRM v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0a0a14]">
  <div id="sidebar-container"></div>
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="glass-dark border-b border-slate-800/60 min-h-14 py-2 md:py-0 flex items-center justify-between px-4 md:px-6 flex-shrink-0 flex-wrap gap-2">
      <div>
        <div class="text-sm font-bold text-white">Tasks</div>
        <div class="text-xs text-slate-500">Individual and team task management</div>
      </div>
      <button onclick="openTaskModal()" class="btn-gradient px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Add Task
      </button>
    </header>
    
    <div class="flex-1 overflow-y-auto p-5 space-y-5">
      <!-- KPIs -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">Total Tasks</div>
          <div class="kpi-value text-indigo-400" id="kpi-total">0</div>
        </div>
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">Completed</div>
          <div class="kpi-value text-emerald-400" id="kpi-completed">0</div>
        </div>
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">In Progress</div>
          <div class="kpi-value text-cyan-400" id="kpi-progress">0</div>
        </div>
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">Pending</div>
          <div class="kpi-value text-rose-400" id="kpi-pending">0</div>
        </div>
      </div>

      <!-- Task List Filters -->
      <div class="chart-card">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div class="chart-title">Tasks</div>
          <div class="flex gap-2">
            <select id="filter-priority" onchange="fetchTasks()" class="input-glass px-2 py-1.5 rounded-lg text-xs">
              <option value="">All Priorities</option>
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
            <select id="filter-status" onchange="fetchTasks()" class="input-glass px-2 py-1.5 rounded-lg text-xs">
              <option value="">All Statuses</option>
              <option value="PENDING">Pending</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </div>
        </div>
        
        <div id="tasks-list-container" class="space-y-2">
          <div class="text-center text-slate-500 py-10">Loading tasks...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Task Edit/Create Modal -->
  <div id="task-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="glass-dark border border-white/10 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="font-bold text-white text-lg" id="modal-title">New Task</h3>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="task-form" class="p-6 space-y-4">
        <input type="hidden" id="task-id">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Title</label>
          <input type="text" id="task-title" required class="w-full input-glass px-3 py-2 rounded-xl text-sm" placeholder="Task summary">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Description</label>
          <textarea id="task-description" class="w-full input-glass px-3 py-2 rounded-xl text-sm h-20" placeholder="Details..."></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Due Date</label>
            <input type="datetime-local" id="task-due-date" required class="w-full input-glass px-3 py-2 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Priority</label>
            <select id="task-priority" class="w-full input-glass px-3 py-2 rounded-xl text-sm bg-slate-950">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Assign To</label>
            <select id="task-assignee" required class="w-full input-glass px-3 py-2 rounded-xl text-sm bg-slate-950">
              <!-- Dynamically populated -->
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Status</label>
            <select id="task-status" class="w-full input-glass px-3 py-2 rounded-xl text-sm bg-slate-950">
              <option value="PENDING" selected>Pending</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </div>
        </div>
        
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeTaskModal()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
          <button type="submit" class="btn-gradient px-6 py-2.5 rounded-xl text-sm font-semibold text-white">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/assets/js/sidebar.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchUsers();
      fetchTasks();
      
      document.getElementById('task-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await saveTask();
      });
    });

    async function fetchUsers() {
      try {
        const res = await fetch('/api/team/members', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` }
        });
        if (!res.ok) throw new Error('Failed to fetch users');
        const users = await res.json();
        const select = document.getElementById('task-assignee');
        select.innerHTML = users.map(u => `<option value="${u.id}">${u.full_name} (${u.role})</option>`).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchTasks() {
      const priority = document.getElementById('filter-priority').value;
      const status = document.getElementById('filter-status').value;
      let url = `/api/tasks/?`;
      if (priority) url += `priority=${priority}&`;
      if (status) url += `status=${status}&`;

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` }
        });
        if (!res.ok) throw new Error('Failed to fetch tasks');
        const tasks = await res.json();
        renderTasks(tasks);
        updateKPIs(tasks);
      } catch (err) {
        if(window.showToast) window.showToast(err.message, 'error');
        console.error(err);
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById('tasks-list-container');
      container.innerHTML = '';
      
      if (tasks.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-500 py-10">No tasks found.</div>`;
        return;
      }
      
      tasks.forEach(t => {
        let priorityColor = 'bg-slate-700 text-slate-300';
        if (t.priority === 'HIGH') priorityColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/30';
        else if (t.priority === 'URGENT') priorityColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/30';
        else if (t.priority === 'LOW') priorityColor = 'bg-emerald-500/10 text-emerald-400';

        const isCompleted = t.status === 'COMPLETED';
        const formattedDate = t.due_date ? new Date(t.due_date).toLocaleString() : 'N/A';

        const item = document.createElement('div');
        item.className = `flex items-center gap-3 p-3 rounded-xl border border-white/8 bg-white/4 hover:bg-white/7 transition-all ${isCompleted ? 'opacity-60' : ''}`;
        item.innerHTML = `
          <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleTaskStatus(${t.id}, this.checked)" class="w-4 h-4 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500/30">
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold text-white ${isCompleted ? 'line-through text-slate-400' : ''}">${t.title}</div>
            <div class="text-xs text-slate-400 mt-0.5">Assigned to: ${t.assigned_to_name} · Due: ${formattedDate}</div>
            ${t.description ? `<div class="text-xs text-slate-500 mt-1 truncate">${t.description}</div>` : ''}
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${priorityColor}">${t.priority}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase bg-slate-800 text-slate-400">${t.status}</span>
            <button onclick='editTask(${JSON.stringify(t).replace(/'/g, "&#39;")})' class="text-slate-400 hover:text-white p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
            <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-rose-400 p-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function updateKPIs(tasks) {
      document.getElementById('kpi-total').textContent = tasks.length;
      document.getElementById('kpi-completed').textContent = tasks.filter(t => t.status === 'COMPLETED').length;
      document.getElementById('kpi-progress').textContent = tasks.filter(t => t.status === 'IN_PROGRESS').length;
      document.getElementById('kpi-pending').textContent = tasks.filter(t => t.status === 'PENDING').length;
    }

    window.openTaskModal = function() {
      document.getElementById('task-form').reset();
      document.getElementById('task-id').value = '';
      document.getElementById('modal-title').textContent = 'New Task';
      
      const modal = document.getElementById('task-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    window.closeTaskModal = function() {
      const modal = document.getElementById('task-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    window.editTask = function(task) {
      document.getElementById('task-id').value = task.id;
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-description').value = task.description || '';
      
      // format to fits local datetime-local input
      if (task.due_date) {
        const localDate = new Date(task.due_date);
        const year = localDate.getFullYear();
        const month = String(localDate.getMonth() + 1).padStart(2, '0');
        const day = String(localDate.getDate()).padStart(2, '0');
        const hours = String(localDate.getHours()).padStart(2, '0');
        const minutes = String(localDate.getMinutes()).padStart(2, '0');
        document.getElementById('task-due-date').value = `${year}-${month}-${day}T${hours}:${minutes}`;
      }
      
      document.getElementById('task-priority').value = task.priority;
      document.getElementById('task-status').value = task.status;
      document.getElementById('task-assignee').value = task.assigned_to_id;
      
      document.getElementById('modal-title').textContent = 'Edit Task';
      
      const modal = document.getElementById('task-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    async function saveTask() {
      const id = document.getElementById('task-id').value;
      const data = {
        title: document.getElementById('task-title').value,
        description: document.getElementById('task-description').value,
        due_date: new Date(document.getElementById('task-due-date').value).toISOString(),
        priority: document.getElementById('task-priority').value,
        status: document.getElementById('task-status').value,
        assigned_to_id: document.getElementById('task-assignee').value
      };
      
      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/tasks/${id}` : '/api/tasks/';
      
      try {
        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('crm_token')}`
          },
          body: JSON.stringify(data)
        });
        
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed to save task');
        
        if (window.showToast) window.showToast('Task saved successfully', 'success');
        closeTaskModal();
        fetchTasks();
      } catch (err) {
        if (window.showToast) window.showToast(err.message, 'error');
      }
    }

    window.toggleTaskStatus = async function(id, isCompleted) {
      const status = isCompleted ? 'COMPLETED' : 'PENDING';
      try {
        const res = await fetch(`/api/tasks/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('crm_token')}`
          },
          body: JSON.stringify({ status })
        });
        if (!res.ok) throw new Error('Failed to update task status');
        fetchTasks();
      } catch (err) {
        if (window.showToast) window.showToast(err.message, 'error');
      }
    }

    window.deleteTask = async function(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      try {
        const res = await fetch(`/api/tasks/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` }
        });
        if (!res.ok) throw new Error('Failed to delete task');
        if (window.showToast) window.showToast('Task deleted', 'success');
        fetchTasks();
      } catch (err) {
        if (window.showToast) window.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
