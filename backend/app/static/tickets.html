<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets — Southeast CRM v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0a0a14]">
  <div id="sidebar-container"></div>
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="glass-dark border-b border-slate-800/60 min-h-14 py-2 md:py-0 flex items-center justify-between px-4 md:px-6 flex-shrink-0 flex-wrap gap-2">
      <div>
        <div class="text-sm font-bold text-white">Support Tickets</div>
        <div class="text-xs text-slate-500">Customer support issues and resolution tracking</div>
      </div>
      <button onclick="openTicketModal()" class="btn-gradient px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Open New Ticket
      </button>
    </header>
    
    <div class="flex-1 overflow-y-auto p-5 space-y-5">
      <!-- KPIs -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">Total Tickets</div>
          <div class="kpi-value text-indigo-400" id="kpi-total">0</div>
        </div>
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">Open</div>
          <div class="kpi-value text-rose-400" id="kpi-open">0</div>
        </div>
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">In Progress</div>
          <div class="kpi-value text-cyan-400" id="kpi-progress">0</div>
        </div>
        <div class="kpi-card">
          <div class="text-[10px] text-slate-500 uppercase font-semibold mb-1">Resolved</div>
          <div class="kpi-value text-emerald-400" id="kpi-resolved">0</div>
        </div>
      </div>

      <!-- Ticket list -->
      <div class="chart-card overflow-x-auto">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div class="chart-title">Support Tickets</div>
          <div class="flex gap-2">
            <select id="filter-priority" onchange="fetchTickets()" class="input-glass px-2 py-1.5 rounded-lg text-xs">
              <option value="">All Priorities</option>
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
            <select id="filter-status" onchange="fetchTickets()" class="input-glass px-2 py-1.5 rounded-lg text-xs">
              <option value="">All Statuses</option>
              <option value="OPEN">Open</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="RESOLVED">Resolved</option>
              <option value="CLOSED">Closed</option>
            </select>
          </div>
        </div>
        
        <div class="overflow-x-auto w-full">
<table class="crm-table w-full">
          <thead>
            <tr>
              <th>ID</th>
              <th>Subject</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tickets-table-body">
            <tr><td colspan="6" class="text-center text-slate-500 py-10">Loading tickets...</td></tr>
          </tbody>
        </table>
</div>
      </div>
    </div>
  </main>

  <!-- Ticket Create Modal -->
  <div id="ticket-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="glass-dark border border-white/10 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="font-bold text-white text-lg" id="modal-title">New Ticket</h3>
        <button onclick="closeTicketModal()" class="text-slate-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="ticket-form" class="p-6 space-y-4">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Subject</label>
          <input type="text" id="ticket-subject" required class="w-full input-glass px-3 py-2 rounded-xl text-sm" placeholder="Brief summary of the issue">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Description</label>
          <textarea id="ticket-description" required class="w-full input-glass px-3 py-2 rounded-xl text-sm h-28" placeholder="Detailed explanation..."></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Priority</label>
            <select id="ticket-priority" class="w-full input-glass px-3 py-2 rounded-xl text-sm bg-slate-950">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </select>
          </div>
        </div>
        
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeTicketModal()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
          <button type="submit" class="btn-gradient px-6 py-2.5 rounded-xl text-sm font-semibold text-white">Submit Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Resolution / Admin Update Modal -->
  <div id="admin-ticket-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
    <div class="glass-dark border border-white/10 w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl">
      <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="font-bold text-white text-lg">Update Support Ticket</h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="admin-ticket-form" class="p-6 space-y-4">
        <input type="hidden" id="admin-ticket-id">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Assignee</label>
          <select id="admin-ticket-assignee" class="w-full input-glass px-3 py-2 rounded-xl text-sm bg-slate-950">
            <!-- Populated dynamically -->
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Status</label>
          <select id="admin-ticket-status" class="w-full input-glass px-3 py-2 rounded-xl text-sm bg-slate-950">
            <option value="OPEN">Open</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="RESOLVED">Resolved</option>
            <option value="CLOSED">Closed</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Resolution / Notes</label>
          <textarea id="admin-ticket-notes" class="w-full input-glass px-3 py-2 rounded-xl text-sm h-28" placeholder="Action taken or notes..."></textarea>
        </div>
        
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeAdminModal()" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
          <button type="submit" class="btn-gradient px-6 py-2.5 rounded-xl text-sm font-semibold text-white">Update Status</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/assets/js/sidebar.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchTickets();
      fetchUsers();
      
      document.getElementById('ticket-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await saveTicket();
      });

      document.getElementById('admin-ticket-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await updateTicketAdmin();
      });
    });

    async function fetchUsers() {
      try {
        const res = await fetch('/api/team/members', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` }
        });
        if (!res.ok) throw new Error('Failed to fetch users');
        const users = await res.json();
        const select = document.getElementById('admin-ticket-assignee');
        select.innerHTML = users.map(u => `<option value="${u.id}">${u.full_name} (${u.role})</option>`).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchTickets() {
      const priority = document.getElementById('filter-priority').value;
      const status = document.getElementById('filter-status').value;
      let url = `/api/tickets/?`;
      if (priority) url += `priority=${priority}&`;
      if (status) url += `status=${status}&`;

      try {
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('crm_token')}` }
        });
        if (!res.ok) throw new Error('Failed to fetch tickets');
        const tickets = await res.json();
        renderTickets(tickets);
        updateKPIs(tickets);
      } catch (err) {
        if(window.showToast) window.showToast(err.message, 'error');
        console.error(err);
      }
    }

    function renderTickets(tickets) {
      const tbody = document.getElementById('tickets-table-body');
      tbody.innerHTML = '';
      
      if (tickets.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-slate-500 py-10">No support tickets found.</td></tr>`;
        return;
      }
      
      tickets.forEach(t => {
        let badgeColor = 'badge-pending';
        if (t.status === 'RESOLVED') badgeColor = 'badge-won';
        else if (t.status === 'IN_PROGRESS') badgeColor = 'badge-active';
        else if (t.status === 'CLOSED') badgeColor = 'badge-overdue';

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>#${t.id}</td>
          <td>
            <div class="font-medium text-white">${t.subject}</div>
            <div class="text-xs text-slate-400 mt-0.5">${t.description}</div>
          </td>
          <td><span class="text-xs font-semibold text-slate-300 bg-slate-800 px-2 py-0.5 rounded">${t.priority}</span></td>
          <td><span class="badge ${badgeColor}">${t.status}</span></td>
          <td>${new Date(t.created_at).toLocaleDateString()}</td>
          <td>
            <button onclick='openAdminModal(${JSON.stringify(t).replace(/'/g, "&#39;")})' class="btn-gradient px-2.5 py-1 rounded text-xs">Update</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateKPIs(tickets) {
      document.getElementById('kpi-total').textContent = tickets.length;
      document.getElementById('kpi-open').textContent = tickets.filter(t => t.status === 'OPEN').length;
      document.getElementById('kpi-progress').textContent = tickets.filter(t => t.status === 'IN_PROGRESS').length;
      document.getElementById('kpi-resolved').textContent = tickets.filter(t => t.status === 'RESOLVED').length;
    }

    window.openTicketModal = function() {
      document.getElementById('ticket-form').reset();
      const modal = document.getElementById('ticket-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    window.closeTicketModal = function() {
      const modal = document.getElementById('ticket-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    window.openAdminModal = function(ticket) {
      document.getElementById('admin-ticket-id').value = ticket.id;
      document.getElementById('admin-ticket-status').value = ticket.status;
      document.getElementById('admin-ticket-notes').value = ticket.resolution_notes || '';
      if (ticket.assigned_to_id) {
        document.getElementById('admin-ticket-assignee').value = ticket.assigned_to_id;
      }
      
      const modal = document.getElementById('admin-ticket-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    window.closeAdminModal = function() {
      const modal = document.getElementById('admin-ticket-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    async function saveTicket() {
      const data = {
        subject: document.getElementById('ticket-subject').value,
        description: document.getElementById('ticket-description').value,
        priority: document.getElementById('ticket-priority').value
      };
      
      try {
        const res = await fetch('/api/tickets/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('crm_token')}`
          },
          body: JSON.stringify(data)
        });
        
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed to submit ticket');
        
        if (window.showToast) window.showToast('Ticket submitted successfully!', 'success');
        closeTicketModal();
        fetchTickets();
      } catch (err) {
        if (window.showToast) window.showToast(err.message, 'error');
      }
    }

    async function updateTicketAdmin() {
      const id = document.getElementById('admin-ticket-id').value;
      const data = {
        status: document.getElementById('admin-ticket-status').value,
        assigned_to_id: document.getElementById('admin-ticket-assignee').value,
        resolution_notes: document.getElementById('admin-ticket-notes').value
      };
      
      try {
        const res = await fetch(`/api/tickets/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('crm_token')}`
          },
          body: JSON.stringify(data)
        });
        
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed to update ticket');
        
        if (window.showToast) window.showToast('Ticket updated successfully!', 'success');
        closeAdminModal();
        fetchTickets();
      } catch (err) {
        if (window.showToast) window.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
