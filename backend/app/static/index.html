<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/crm-store.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Southeast Landmark CRM v2.0</title>
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body class="auth-bg h-screen w-screen flex items-center justify-center font-sans antialiased text-white">
  
  

  <div class="auth-card glass p-10 rounded-2xl w-full max-w-md mx-4 shadow-2xl relative overflow-hidden">
    <!-- Gradient blur accent -->
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-indigo-600 rounded-full mix-blend-screen filter blur-3xl opacity-50"></div>
    <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-violet-600 rounded-full mix-blend-screen filter blur-3xl opacity-50"></div>
    
    <div class="relative z-10">
      <div class="text-center mb-8">
        <div id="login-logo-container" class="w-16 h-16 mx-auto mb-4 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg bg-cover bg-center">
          <span id="login-logo-text" class="text-2xl font-bold tracking-tighter">SL</span>
        </div>
        <h1 id="login-company-name" class="text-2xl font-semibold tracking-tight">Southeast Landmark Ltd.</h1>
        <p class="text-sm text-slate-400 mt-1">Sales CRM v2.0</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div id="step-1">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
            <input type="email" id="email" class="w-full input-glass px-4 py-3 rounded-lg focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="name@southeast.com" required>
          </div>
          <div class="mt-4">
            <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
            <input type="password" id="password" class="w-full input-glass px-4 py-3 rounded-lg focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="••••••••" required>
          </div>
          <div id="login-error" class="hidden mt-3 text-sm text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg px-3 py-2 text-center"></div>
          <button type="submit" class="w-full btn-gradient mt-4 py-3 rounded-lg font-medium shadow-lg hover:shadow-indigo-500/25 transition-all text-white flex justify-center items-center">
            <span id="btn-text">Sign In</span>
            <svg id="btn-spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          </button>
        </div>

        <div id="step-mfa" class="hidden">
          <div class="text-center mb-6">
            <p id="mfa-prompt-text" class="text-sm text-slate-300">Enter the 6-digit code from your authenticator app.</p>
          </div>
          <div class="flex justify-center gap-2 mb-6">
            <input type="text" maxlength="1" class="mfa-input w-12 h-14 input-glass text-center text-xl font-semibold rounded-lg focus:ring-2 focus:ring-indigo-500" />
            <input type="text" maxlength="1" class="mfa-input w-12 h-14 input-glass text-center text-xl font-semibold rounded-lg focus:ring-2 focus:ring-indigo-500" />
            <input type="text" maxlength="1" class="mfa-input w-12 h-14 input-glass text-center text-xl font-semibold rounded-lg focus:ring-2 focus:ring-indigo-500" />
            <span class="text-2xl text-slate-500 self-center">-</span>
            <input type="text" maxlength="1" class="mfa-input w-12 h-14 input-glass text-center text-xl font-semibold rounded-lg focus:ring-2 focus:ring-indigo-500" />
            <input type="text" maxlength="1" class="mfa-input w-12 h-14 input-glass text-center text-xl font-semibold rounded-lg focus:ring-2 focus:ring-indigo-500" />
            <input type="text" maxlength="1" class="mfa-input w-12 h-14 input-glass text-center text-xl font-semibold rounded-lg focus:ring-2 focus:ring-indigo-500" />
          </div>
          <button type="button" id="verify-mfa" class="w-full btn-gradient py-3 rounded-lg font-medium shadow-lg">Verify & Continue</button>
        </div>
      </form>

      <div class="mt-8 text-center text-xs text-slate-500 flex items-center justify-center gap-1">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
        Secured with 256-bit encryption
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module" src="/assets/js/api.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
  <script type="module" src="/assets/js/auth.js"></script>
  <script>
    // (the 600 KB three.js particle background was removed — the #auth-canvas
    //  element it drew into no longer exists on this page, so it was dead weight
    //  that delayed first paint on the login screen)

    // Fetch dynamic branding
    fetch('/api/settings/branding').then(r => r.json()).then(data => {
      const nameEl = document.getElementById('login-company-name');
      const logoContainer = document.getElementById('login-logo-container');
      const logoText = document.getElementById('login-logo-text');
      if (nameEl && data.company_name) {
        nameEl.textContent = data.company_name;
        document.title = document.title.replace('Southeast Landmark', data.company_name);
      }
      if (logoContainer && data.company_logo) {
        logoContainer.style.backgroundImage = `url(${data.company_logo})`;
        if (logoText) logoText.style.display = 'none';
      } else if (nameEl && data.company_name && logoText) {
        logoText.textContent = data.company_name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
      }
    }).catch(e => console.error(e));
  </script>
</body>
</html>
