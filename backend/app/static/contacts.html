<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts - CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="flex h-screen overflow-hidden text-slate-100 bg-[#0f0f1a]">
  
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="glass-dark border-b border-slate-800 min-h-16 py-2 md:py-0 flex items-center justify-between px-4 md:px-6 flex-wrap gap-2">
      <div class="text-lg font-semibold">Contact Database</div>
      <button class="btn-gradient px-4 py-2 rounded-lg text-sm font-medium">+ New Contact</button>
    </header>

    <div class="p-4 border-b border-slate-800 flex gap-4">
      <input type="text" placeholder="Search by name, phone, email..." class="input-glass px-4 py-2 rounded-lg text-sm flex-1">
      <select class="input-glass px-3 py-2 rounded-lg text-sm">
        <option>All Sources</option>
      </select>
    </div>

    <div class="flex-1 overflow-y-auto p-4">
      <div class="glass rounded-xl overflow-hidden overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-white/5 text-slate-400">
            <tr>
              <th class="p-4 font-medium">Name</th>
              <th class="p-4 font-medium">Phone</th>
              <th class="p-4 font-medium">Source</th>
              <th class="p-4 font-medium">Opps</th>
              <th class="p-4 font-medium">Last Activity</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800">
            <tr class="hover:bg-white/5 cursor-pointer transition">
              <td class="p-4 font-medium text-white flex items-center gap-2">John Doe <span class="bg-yellow-500/20 text-yellow-300 text-[10px] px-1.5 py-0.5 rounded border border-yellow-500/30">Possible Duplicate</span></td>
              <td class="p-4 text-slate-300">01711223344</td>
              <td class="p-4"><span class="badge badge-active">Facebook</span></td>
              <td class="p-4 font-medium">2</td>
              <td class="p-4 text-slate-400">2 hrs ago</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

</body>
</html>
